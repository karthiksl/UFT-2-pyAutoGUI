# ============================================================
# DATA_BINDINGS — logical field → data file column mappings
# source values match Data/<DataSource>/ directory names
# ============================================================
data_bindings:

  # Member identification
  member_id:
    source: member_data
    column: MemberID
    notes: "Internal TEST MRN; 7–10 digits"

  member_last_name:
    source: member_data
    column: LastName

  member_first_name:
    source: member_data
    column: FirstName

  member_dob:
    source: member_data
    column: DateOfBirth
    format: "%m/%d/%Y"

  member_ssn:
    source: member_data
    column: SSN
    notes: "Masked in logs; never OCR-read; last-4 only when required by workflow"
    sensitive: true

  member_address_line1:
    source: member_data
    column: AddressLine1

  member_address_city:
    source: member_data
    column: City

  member_address_state:
    source: member_data
    column: State

  member_address_zip:
    source: member_data
    column: ZipCode

  member_phone_primary:
    source: member_data
    column: PhonePrimary

  member_language_preference:
    source: member_data
    column: LanguagePreference

  # Coverage / enrollment
  coverage_effective_date:
    source: coverage_data
    column: EffectiveDate
    format: "%m/%d/%Y"

  coverage_type:
    source: coverage_data
    column: CoverageType
    notes: "e.g. Medical, Dental, Vision"

  coverage_group_number:
    source: coverage_data
    column: GroupNumber

  plan_name:
    source: coverage_data
    column: PlanName
    notes: "Must match exactly the plan name displayed in plan_selection grid"

  change_reason:
    source: coverage_data
    column: ChangeReason
    notes: "Dropdown value; must match Epic lookup table text exactly"

  # Dependent
  dep_first_name:
    source: dependent_data
    column: DependentFirstName

  dep_last_name:
    source: dependent_data
    column: DependentLastName

  dep_dob:
    source: dependent_data
    column: DependentDOB
    format: "%m/%d/%Y"

  dep_relationship:
    source: dependent_data
    column: RelationshipType
    notes: "e.g. Spouse, Child, Domestic Partner"

  # Test metadata
  test_case_id:
    source: member_data
    column: TestCaseID
    notes: "TEST_188xxx identifier; used for report labelling"

  expected_confirmation_status:
    source: coverage_data
    column: ExpectedStatus
    notes: "Accepted|Pending; compared against confirmation.status_value OCR result"
