# ============================================================
# Visual Object Repository — Epic Hyperdrive on Citrix / VDI
# ============================================================
# All regions are [x, y, width, height] in absolute screen
# pixels measured from the top-left corner of the physical
# display (NOT relative to the Citrix window).
# Captured at: 1920×1080, 100 % DPI, Citrix Workspace 2309.
# Update `meta.dpi_profile` and retake PNGs after any
# resolution or DPI policy change.
# ============================================================

meta:
  version: 1
  application: Epic Hyperdrive
  framework: app_automation_pyautogui
  dpi_profile: 100          # Windows Display Scale — golden reference
  resolution: 1920x1080
  citrix: true
  notes: >
    All placeholder images must be re-captured inside the Citrix
    session on the execution host before first CI run.
    See automation/README.md §"Adding a new screen".

# ============================================================
# CITRIX — session-level anchors consumed by core/citrix.py
# ============================================================
citrix:

  session_frame:
    description: >
      Citrix Workspace toolbar strip that confirms the ICA window
      is the active foreground window. Matched against the
      characteristic Citrix gradient / logo element in the top bar.
    image: citrix_system/session_frame_bar.png   # captured_at: TBD
    region: [0, 0, 1920, 38]                     # captured_at: 1920x1080
    min_confidence: 0.82    # lower than default — bar is partly occluded by Epic chrome
    status: placeholder

  disconnected:
    description: Full-screen overlay shown when ICA session drops.
    image: citrix_system/disconnected_overlay.png  # captured_at: TBD
    region: [600, 350, 720, 200]                   # captured_at: 1920x1080
    min_confidence: 0.90
    status: placeholder

  reconnecting:
    description: Citrix "Reconnecting…" progress dialog.
    image: citrix_system/reconnecting_dialog.png   # captured_at: TBD
    region: [660, 380, 600, 160]                   # captured_at: 1920x1080
    min_confidence: 0.88
    status: placeholder

  session_locked:
    description: Windows lock screen rendered inside Citrix session.
    image: citrix_system/session_locked_screen.png # captured_at: TBD
    region: [0, 0, 1920, 1080]                     # captured_at: 1920x1080
    min_confidence: 0.85
    status: placeholder

  logon_in_progress:
    description: >
      Epic SSO / Active Directory logon spinner that appears on
      cold-start before the Epic Hub loads.
    image: citrix_system/logon_in_progress.png     # captured_at: TBD
    region: [760, 440, 400, 120]                   # captured_at: 1920x1080
    min_confidence: 0.85
    status: placeholder

# ============================================================
# BUSY — spinners / loading indicators consumed by core/waits.py
# ============================================================
busy:

  epic_spinner:
    description: >
      Epic Hyperdrive hourglass / activity ring that blocks the
      UI during server-side processing (plan changes, saves, etc.).
    image: busy/epic_activity_spinner.png          # captured_at: TBD
    region: [860, 490, 200, 100]                   # captured_at: 1920x1080; centre-screen
    min_confidence: 0.80
    status: placeholder

  wait_cursor:
    description: Windows wait cursor arrow overlay (optional probe).
    image: busy/windows_wait_cursor.png            # captured_at: TBD
    region: [0, 0, 1920, 1080]                     # full-screen sweep
    min_confidence: 0.75
    # lower threshold — cursor may appear anywhere on screen
    status: placeholder

  modal_loading:
    description: >
      Generic Epic modal "Loading…" / "Please wait" banner that
      overlays the content area during navigation.
    image: busy/epic_modal_loading_banner.png      # captured_at: TBD
    region: [560, 420, 800, 140]                   # captured_at: 1920x1080
    min_confidence: 0.82
    status: placeholder

# ============================================================
# SCREENS — logical screen groups; anchors gate navigation
# ============================================================
screens:

  epic_login:
    description: Epic Hyperdrive single-sign-on / credentials screen.
    anchor:
      image: anchors/epic_login/epic_logo_header.png   # captured_at: TBD
      region: [760, 180, 400, 100]                      # captured_at: 1920x1080
      min_confidence: 0.88
      status: placeholder
    next_screens: [epic_home]

  epic_home:
    description: >
      Epic Hub dashboard — the landing screen after login showing
      department activity, recent patients, and quick-launch tiles.
    anchor:
      image: anchors/epic_home/epic_hub_header.png     # captured_at: TBD
      region: [0, 38, 400, 55]                          # captured_at: 1920x1080
      min_confidence: 0.87
      status: placeholder
    next_screens: [member_search]

  member_search:
    description: >
      Patient / member lookup screen with name, MRN, and DOB
      search fields. Entry point for all member-record workflows.
    anchor:
      image: anchors/member_search/patient_search_header.png  # captured_at: TBD
      region: [210, 90, 500, 50]                               # captured_at: 1920x1080
      min_confidence: 0.87
      status: placeholder
    next_screens: [member_chart, member_demographics]

  member_chart:
    description: >
      Member chart summary view — shows active coverages, flags,
      and primary demographic banner.
    anchor:
      image: anchors/member_chart/chart_banner_header.png  # captured_at: TBD
      region: [210, 90, 700, 55]                            # captured_at: 1920x1080
      min_confidence: 0.86
      status: placeholder
    next_screens: [member_demographics, enrollment, coverage_change, notes]

  member_demographics:
    description: >
      Demographics tab — address, phone, language preference, and
      emergency contact; editable fields require a pending change record.
    anchor:
      image: anchors/member_demographics/demographics_tab_active.png  # captured_at: TBD
      region: [210, 130, 300, 45]                                       # captured_at: 1920x1080
      min_confidence: 0.86
      status: placeholder
    next_screens: [member_chart, confirmation]

  enrollment:
    description: >
      New member enrollment transaction screen — plan selection,
      effective date, and group number entry.
    anchor:
      image: anchors/enrollment/enrollment_header_banner.png  # captured_at: TBD
      region: [210, 90, 600, 55]                               # captured_at: 1920x1080
      min_confidence: 0.87
      status: placeholder
    next_screens: [plan_selection, dependent_management, confirmation]

  coverage_change:
    description: >
      Coverage change transaction screen — modify plan, tier,
      or effective date for an existing member record.
    anchor:
      image: anchors/coverage_change/coverage_change_header.png  # captured_at: TBD
      region: [210, 90, 650, 55]                                   # captured_at: 1920x1080
      min_confidence: 0.87
      status: placeholder
    next_screens: [plan_selection, confirmation]

  plan_selection:
    description: >
      Plan selection modal / sub-screen — lists available TEST plans
      with tier and premium columns; user selects a radio row.
    anchor:
      image: anchors/plan_selection/plan_grid_header.png  # captured_at: TBD
      region: [400, 200, 1100, 55]                         # captured_at: 1920x1080
      min_confidence: 0.86
      status: placeholder
    next_screens: [enrollment, coverage_change]

  dependent_management:
    description: >
      Add / terminate dependent sub-screen within enrollment;
      shows dependent list and relationship type dropdown.
    anchor:
      image: anchors/dependent_management/dependent_mgmt_header.png  # captured_at: TBD
      region: [210, 90, 600, 55]                                       # captured_at: 1920x1080
      min_confidence: 0.86
      status: placeholder
    next_screens: [enrollment, confirmation]

  confirmation:
    description: >
      Transaction confirmation / success screen — displays a
      confirmation number and summary of submitted changes.
    anchor:
      image: anchors/confirmation/confirmation_banner.png  # captured_at: TBD
      region: [210, 90, 700, 55]                            # captured_at: 1920x1080
      min_confidence: 0.88
      status: placeholder
    next_screens: [epic_home, member_chart]

  notes:
    description: >
      Notes / comments tab on member chart — free-text audit trail
      entries required by business process after certain transactions.
    anchor:
      image: anchors/notes/notes_tab_active.png  # captured_at: TBD
      region: [210, 130, 200, 45]                 # captured_at: 1920x1080
      min_confidence: 0.85
      status: placeholder
    next_screens: [member_chart]

  error_dialog:
    description: >
      Epic error / warning modal dialog — intercepted by the
      modal-watcher hook; dismiss logic lives in common/dialogs.py.
    anchor:
      image: anchors/error_dialog/epic_error_dialog_header.png  # captured_at: TBD
      region: [560, 300, 800, 60]                                  # captured_at: 1920x1080
      min_confidence: 0.88
      status: placeholder
    next_screens: []    # dismiss always returns to the interrupted screen

