# ============================================================
# OCR_TARGETS — read-only validation regions
# All business code calls ocr.assert_text("<name>", actual=...)
# ============================================================
ocr_targets:

  - name: member_chart.member_id_display
    screen: member_chart
    region: [700, 95, 300, 42]                     # captured_at: 1920x1080
    expected_pattern: "MRN\\s*:\\s*\\d{6,10}"
    lang: eng
    preprocess: [grayscale, upscale_2x, otsu_threshold]
    min_confidence: 0.70
    notes: >
      MRN display in chart banner; Epic custom font at ~11pt needs 2× upscale.
      Tesseract --psm 7 (single line) recommended.
    status: placeholder

  - name: member_chart.member_name_display
    screen: member_chart
    region: [210, 95, 480, 42]                     # captured_at: 1920x1080
    expected_pattern: "[A-Z][a-z]+,\\s*[A-Z][a-z]+"
    lang: eng
    preprocess: [grayscale, upscale_2x, otsu_threshold]
    min_confidence: 0.68
    notes: "Last, First format in chart banner"
    status: placeholder

  - name: confirmation.confirmation_number_value
    screen: confirmation
    region: [210, 195, 600, 50]                    # captured_at: 1920x1080
    expected_pattern: "(?:Confirmation|Conf\\.?)\\s*#?\\s*:\\s*\\d{8,14}"
    lang: eng
    preprocess: [grayscale, upscale_2x, otsu_threshold]
    min_confidence: 0.70
    notes: "Confirmation number format varies by transaction type; adjust pattern per flow"
    status: placeholder

  - name: confirmation.status_value
    screen: confirmation
    region: [210, 255, 400, 50]                    # captured_at: 1920x1080
    expected_pattern: "(?:Accepted|Pending|Rejected)"
    lang: eng
    preprocess: [grayscale, upscale_2x, otsu_threshold]
    min_confidence: 0.72
    status: placeholder

  - name: coverage_change.current_plan_name_value
    screen: coverage_change
    region: [380, 195, 700, 50]                    # captured_at: 1920x1080
    expected_pattern: "TEST\\s+[A-Z][A-Za-z\\s]+(?:HMO|PPO|HDHP|EPO)"
    lang: eng
    preprocess: [grayscale, upscale_2x, gaussian_denoise, otsu_threshold]
    min_confidence: 0.65
    notes: >
      Plan name includes TEST prefix + tier acronym; Citrix JPEG compression
      artifacts are worst here — gaussian_denoise pass is mandatory.
    status: placeholder

  - name: enrollment.selected_plan_name_value
    screen: enrollment
