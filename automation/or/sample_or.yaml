# ============================================================
# Visual Object Repository — SAMPLE_TEST_000001 Dry-Run Fixture
# ============================================================
# This file uses the SAME schema as app_or.yaml.
# All regions are [x, y, width, height] in absolute screen
# pixels measured from the top-left corner of the screen.
#
# Screen size: 1280×800 (generated by generate_mock_screens.py)
# DPI profile: 100 (no scaling)
# Citrix simulation: screen_player.py (tkinter window)
#
# All images are under automation/assets/images/sample/
# Run: python fixtures/sample_uft/generate_mock_screens.py
#      before using this OR file.
# ============================================================

meta:
  version: 1
  application: Mock Epic (Sample Fixture)
  framework: app_automation_pyautogui
  dpi_profile: 100
  resolution: 1280x800
  citrix: false     # screen_player is a plain tkinter window, not Citrix
  notes: >
    Synthetic fixture for offline E2E dry-run.
    All PNGs are generated by generate_mock_screens.py — run it once
    before executing tests that reference this OR file.

# ============================================================
# CITRIX — session-level anchor for the mock Citrix chrome
# The screen_player.py window title bar acts as the anchor.
# ============================================================
citrix:

  session_frame:
    description: Mock Citrix title-bar strip at the top of the window.
    image: sample/frame_titlebar.png
    region: [0, 0, 400, 36]
    min_confidence: 0.80
    status: stable

  disconnected:
    description: Not applicable for mock — required by schema.
    image: sample/frame_titlebar.png     # placeholder reuse
    region: [0, 0, 1, 1]
    min_confidence: 0.99
    status: placeholder

  reconnecting:
    description: Not applicable for mock.
    image: sample/frame_titlebar.png
    region: [0, 0, 1, 1]
    min_confidence: 0.99
    status: placeholder

  session_locked:
    description: Not applicable for mock.
    image: sample/frame_titlebar.png
    region: [0, 0, 1, 1]
    min_confidence: 0.99
    status: placeholder

  logon_in_progress:
    description: Not applicable for mock.
    image: sample/frame_titlebar.png
    region: [0, 0, 1, 1]
    min_confidence: 0.99
    status: placeholder

# ============================================================
# BUSY — no spinner in the mock; stubs required by loader
# ============================================================
busy:

  epic_spinner:
    description: Not used in sample fixture.
    image: sample/frame_titlebar.png
    region: [0, 0, 1, 1]
    min_confidence: 0.99
    status: placeholder

  wait_cursor:
    description: Not used in sample fixture.
    image: sample/frame_titlebar.png
    region: [0, 0, 1, 1]
    min_confidence: 0.99
    status: placeholder

  modal_loading:
    description: Not used in sample fixture.
    image: sample/frame_titlebar.png
    region: [0, 0, 1, 1]
    min_confidence: 0.99
    status: placeholder

# ============================================================
# SCREENS — three logical screens in the sample flow
# ============================================================
screens:

  sample_login:
    description: Mock Epic login screen with username/password fields.
    anchor:
      image: sample/login_header_banner.png
      region: [0, 36, 1280, 55]
      min_confidence: 0.82
      status: stable
    next_screens: [sample_home]

  sample_home:
    description: Home screen showing the patient MRN banner and tab strip.
    anchor:
      image: sample/home_banner_label.png
      region: [0, 91, 1280, 44]
      min_confidence: 0.82
      status: stable
    next_screens: [sample_coverage]

  sample_coverage:
    description: Coverage screen showing the effective date field.
    anchor:
      image: sample/coverage_header.png
      region: [20, 129, 1240, 50]
      min_confidence: 0.80
      status: stable

# ============================================================
# OBJECTS
# Coordinates computed from generate_mock_screens.py geometry:
#   TITLEBAR_H = 36
#   Header strip = 36..91  (height 55)
#   Home banner  = 91..135 (height 44)
#   Tab bar      = 135..173 (height 38)
#   Login card   = (390, 116, 890, 456)
# ============================================================
objects:

  # ----------------------------------------------------------
  # sample_login
  # ----------------------------------------------------------
  - name: sample_login.header_label
    screen: sample_login
    type: label
    image: sample/login_header_banner.png
    region: [0, 36, 1280, 55]
    min_confidence: 0.82
    notes: "Mock Epic header — navigation anchor for login screen"
    status: stable

  - name: sample_login.username_field
    screen: sample_login
    type: input
    image: sample/login_username_input.png
    region: [448, 174, 384, 60]
    min_confidence: 0.80
    notes: "Username label + input box crop"
    status: stable

  - name: sample_login.password_field
    screen: sample_login
    type: input
    image: sample/login_password_input.png
    region: [448, 249, 384, 60]
    min_confidence: 0.80
    notes: "Password label + input box crop"
    status: stable

  - name: sample_login.login_button
    screen: sample_login
    type: button
    image: sample/login_button.png
    region: [570, 366, 140, 42]
    min_confidence: 0.82
    expect_after: sample_home.banner_label
    notes: "Login submit button"
    status: stable

  # ----------------------------------------------------------
  # sample_home
  # ----------------------------------------------------------
  - name: sample_home.banner_label
    screen: sample_home
    type: label
    image: sample/home_banner_label.png
    region: [0, 91, 1280, 44]
    min_confidence: 0.82
    notes: "Patient MRN banner — post-login assertion anchor"
    status: stable

  - name: sample_home.coverage_tab
    screen: sample_home
    type: tab
    image: sample/home_coverage_tab.png
    region: [162, 135, 160, 38]
    min_confidence: 0.80
    expect_after: sample_coverage.header_label
    notes: "Second tab in the tab strip (Summary | Coverage | ...)"
    status: stable

  # ----------------------------------------------------------
  # sample_coverage
  # ----------------------------------------------------------
  - name: sample_coverage.header_label
    screen: sample_coverage
    type: label
    image: sample/coverage_header.png
    region: [20, 129, 1240, 50]
    min_confidence: 0.80
    notes: "Coverage section header — post-navigation anchor"
    status: stable

  - name: sample_coverage.effective_date_field
    screen: sample_coverage
    type: label
    image: sample/coverage_effective_date_field.png
    region: [30, 197, 202, 62]
    min_confidence: 0.78
    notes: "Effective Date label + value box crop; OCR-validated"
    status: stable

# ============================================================
# OCR_TARGETS
# ============================================================
ocr_targets:

  - name: sample_home.mrn_text
    screen: sample_home
    region: [20, 98, 500, 30]
    expected_pattern: "MRN:\\s*\\d{7}"
    lang: eng
    preprocess: [grayscale, upscale_2x, otsu_threshold, invert]
    min_confidence: 0.60
    notes: >
      Reads the MRN from the patient banner.
      Banner text: "Rivera, Maria  MRN: 1234567  DOB: ..."
      The pattern matches just the MRN segment.
    status: stable

  - name: sample_coverage.effective_date_value
    screen: sample_coverage
    region: [38, 221, 192, 36]
    expected_pattern: "\\d{2}/\\d{2}/\\d{4}"
    lang: eng
    preprocess: [grayscale, upscale_2x, otsu_threshold]
    min_confidence: 0.60
    notes: >
      Reads the effective date value from inside the read-only date box.
      Expected: MM/DD/YYYY  (e.g. 01/01/2026)
    status: stable

# ============================================================
# DATA_BINDINGS — maps to SAMPLE_TEST_000001.csv columns
# ============================================================
data_bindings:

  member_id:
    source: SAMPLE_TEST_000001
    column: MemberID
    notes: "7-digit MRN; validated against sample_home.mrn_text OCR result"

  member_last_name:
    source: SAMPLE_TEST_000001
    column: LastName

  member_first_name:
    source: SAMPLE_TEST_000001
    column: FirstName

  member_dob:
    source: SAMPLE_TEST_000001
    column: DateOfBirth
    format: "%m/%d/%Y"

  coverage_effective_date:
    source: SAMPLE_TEST_000001
    column: CoverageEffectiveDate
    format: "%m/%d/%Y"

  expected_status:
    source: SAMPLE_TEST_000001
    column: ExpectedStatus

  test_case_id:
    source: SAMPLE_TEST_000001
    column: TestCaseID
